<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tatreez Project</title>

<style>
body {
    margin: 0;
    background-color: #f3efe6;
    display: flex;
    justify-content: center;
    font-family: "Courier New", monospace;
}

/* Header */
.header-box {
    position: fixed;
    top: 20px;
    left: 20px;
    background: white;
    border: 2px solid #8B0000;
    padding: 12px 18px;
    font-size: 14px;
}

/* Main panel */
.panel {
    width: 260px;
    min-height: 100vh;
    background: #fffdf8;
    border-left: 8px solid #7a1c1c;
    border-right: 8px solid #7a1c1c;
    padding-top: 120px;
}

/* Each embroidery band */
.band {
    display: grid;
    grid-template-columns: repeat(21, 10px);
    gap: 2px;
    justify-content: center;
    margin: 25px 0;
}

/* stitches */
.stitch {
    width: 10px;
    height: 10px;
}

.red { background: #8B0000; }
.gold { background: #c9a227; }
.black { background: #000; }

/* spacing */
.empty { background: transparent; }
</style>
</head>

<body>

<div class="header-box">
<strong>Professor Gamal ElDin</strong><br>
Core Topics in Non-US History<br>
Tatreez Project
</div>

<div class="panel">

<!-- REPEAT THIS BAND MULTIPLE TIMES FOR LENGTH -->

<div class="band">
<!-- Row 1 -->
<div class="empty"></div><div class="red"></div><div class="gold"></div><div class="red"></div><div class="empty"></div>

<!-- Row 2 -->
<div class="red"></div><div class="black"></div><div class="gold"></div><div class="black"></div><div class="red"></div>

<!-- Row 3 -->
<div class="gold"></div><div class="gold"></div><div class="red"></div><div class="gold"></div><div class="gold"></div>

<!-- Row 4 -->
<div class="red"></div><div class="black"></div><div class="gold"></div><div class="black"></div><div class="red"></div>

<!-- Row 5 -->
<div class="empty"></div><div class="red"></div><div class="gold"></div><div class="red"></div><div class="empty"></div>
</div>
<!-- duplicate band to create vertical tatreez -->
<div class="band">
<div class="empty"></div><div class="empty"></div><div class="red"></div><div class="gold"></div><div class="gold"></div><div class="red"></div><div class="empty"></div><div class="gold"></div><div class="red"></div><div class="black"></div><div class="red"></div><div class="gold"></div><div class="empty"></div><div class="red"></div><div class="gold"></div><div class="gold"></div><div class="red"></div><div class="empty"></div><div class="empty"></div>

<div class="empty"></div><div class="red"></div><div class="gold"></div><div class="black"></div><div class="black"></div><div class="gold"></div><div class="red"></div><div class="gold"></div><div class="black"></div><div class="red"></div><div class="black"></div><div class="gold"></div><div class="red"></div><div class="gold"></div><div class="black"></div><div class="black"></div><div class="gold"></div><div class="red"></div><div class="empty"></div>

<div class="red"></div><div class="gold"></div><div class="black"></div><div class="red"></div><div class="gold"></div><div class="gold"></div><div class="red"></div><div class="black"></div><div class="gold"></div><div class="red"></div><div class="gold"></div><div class="black"></div><div class="red"></div><div class="gold"></div><div class="gold"></div><div class="red"></div><div class="black"></div><div class="gold"></div><div class="red"></div>
</div>

<!-- add more copies if you want it longer -->

</div>

</body>
</html>
