<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tatreez Project</title>

<style>
    body {
        margin: 0;
        padding: 0;
        background-color: #f3efe6;
        font-family: "Courier New", monospace;
        display: flex;
        justify-content: center;
    }

    .header-box {
        position: fixed;
        top: 20px;
        left: 20px;
        background: white;
        border: 2px solid #8B0000;
        padding: 12px 18px;
        font-size: 14px;
        line-height: 1.4;
    }

    .tatreez-panel {
        width: 240px;
        min-height: 100vh;
        background: #fffdf8;
        border-left: 6px solid #7a1c1c;
        border-right: 6px solid #7a1c1c;
        padding-top: 150px;
        box-shadow: 0 0 20px rgba(0,0,0,0.15);
    }

    /* GRID SYSTEM */
    .band {
        display: grid;
        grid-template-columns: repeat(20, 10px);
        grid-template-rows: repeat(20, 10px);
        gap: 2px;
        margin: 30px auto;
        width: max-content;
    }

    .stitch {
        width: 10px;
        height: 10px;
        background-color: transparent;
    }

    /* COLORS */
    .red { background-color: #8B0000; }
    .gold { background-color: #c9a227; }
    .black { background-color: #000; }
</style>
</head>

<body>

<div class="header-box">
    <strong>Professor Gamal ElDin</strong><br>
    Core Topics in Non‑US History<br>
    Tatreez Project
</div>

<div class="tatreez-panel">

    <!-- TRADITIONAL BETHLEHEM STAR BAND -->
    <div class="band">
        <!-- 20x20 grid — each row is written left to right -->
        <!-- This creates a traditional tatreez star motif -->

        <!-- Row 1 -->
        <div></div><div></div><div></div><div class="red"></div><div class="red"></div><div></div><div></div><div></div><div class="gold"></div><div class="gold"></div><div></div><div></div><div></div><div class="red"></div><div class="red"></div><div></div><div></div><div></div><div></div><div></div>

        <!-- Row 2 -->
        <div></div><div></div><div class="red"></div><div class="gold"></div><div class="gold"></div><div class="red"></div><div></div><div class="gold"></div><div class="red"></div><div class="red"></div><div class="gold"></div><div></div><div class="red"></div><div class="gold"></div><div class="gold"></div><div class="red"></div><div></div><div></div><div></div><div></div>

        <!-- Row 3 -->
        <div></div><div class="red"></div><div class="gold"></div><div class="black"></div><div class="black"></div><div class="gold"></div><div class="red"></div><div class="gold"></div><div class="black"></div><div class="black"></div><div class="gold"></div><div class="red"></div><div class="gold"></div><div class="black"></div><div class="black"></div><div class="gold"></div><div class="red"></div><div></div><div></div><div></div>

        <!-- Row 4 -->
        <div class="red"></div><div class="gold"></div><div class="black"></div><div class="red"></div><div class="red"></div><div class="black"></div><div class="gold"></div><div class="black"></div><div class="red"></div><div class="red"></div><div class="black"></div><div class="gold"></div><div class="black"></div><div class="red"></div><div class="red"></div><div class="black"></div><div class="gold"></div><div class="red"></div><div></div><div></div>

        <!-- Row 5 -->
        <div class="red"></div><div class="gold"></div><div class="black"></div><div class="red"></div><div class="gold"></div><div class="gold"></div><div class="red"></div><div class="black"></div><div class="red"></div><div class="gold"></div><div class="gold"></div><div class="red"></div><div class="black"></div><div class="red"></div><div class="gold"></div><div class="gold"></div><div class="red"></div><div class="black"></div><div class="gold"></div><div class="red"></div>

        <!-- Row 6 -->
        <div class="red"></div><div class="gold"></div><div class="black"></div><div class="red"></div><div class="gold"></div><div class="black"></div><div class="gold"></div><div class="red"></div><div class="gold"></div><div class="black"></div><div class="gold"></div><div class="red"></div><div class="gold"></div><div class="black"></div><div class="gold"></div><div class="red"></div><div class="black"></div><div class="gold"></div><div class="red"></div><div></div>

        <!-- Row 7 -->
        <div></div><div class="red"></div><div class="gold"></div><div class="black"></div><div class="red"></div><div class="gold"></div><div class="black"></div><div class="gold"></div><div class="black"></div><div class="gold"></div><div class="red"></div><div class="black"></div><div class="gold"></div><div class="red"></div><div class="black"></div><div class="gold"></div><div class="red"></div><div></div><div></div><div></div>

        <!-- Row 8 -->
        <div></div><div></div><div class="red"></div><div class="gold"></div><div class="black"></div><div class="red"></div><div class="gold"></div><div class="black"></div><div class="gold"></div><div class="red"></div><div class="black"></div><div class="gold"></div><div class="red"></div><div class="black"></div><div class="gold"></div><div class="red"></div><div></div><div></div><div></div><div></div>

        <!-- Rows 9–20 mirror rows 1–8 -->
        <!-- You can duplicate rows 7 → 1 here if you want a longer band -->
    </div>

</div>

</body>
</html>
