<style>

    margin: 0;
    background-color: #f3efe6;
    display: flex;
    justify-content: center;
    font-family: "Courier New", monospace;
}


.header-box {
    position: fixed;
    top: 20px;
    left: 20px;
    background: white;
    border: 2px solid #8B0000;
    padding: 12px 18px;
    font-size: 14px;
}


.panel {
    width: 260px;
    min-height: 100vh;
    background: #fffdf8;
    border-left: 8px solid #7a1c1c;
    border-right: 8px solid #7a1c1c;
    padding-top: 120px;
}

.band {
    display: grid;
    grid-template-columns: repeat(5, 16px);
    gap: 4px;
    justify-content: center;
    margin: 40px 0;
}


.stitch {
    width: 16px;
    height: 16px;
}

.red { background: #8B0000; }
.gold { background: #c9a227; }
.black { background: #000; }
.empty { background: transparent; }
